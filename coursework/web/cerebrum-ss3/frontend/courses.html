<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Courses - Online IT Courses">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../frontend/css/styles.css">
    <title>Courses</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0077cc;">
            <div class="container">
                <a class="navbar-brand" href="/"><img src="../frontend/images/CerebrumLogo.png" alt="Cerebrum Online IT Courses Logo" class="navbar-logo">Cerebrum IT Courses</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/about">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/courses">Courses</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/contact">Contact Us</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero fade-in text-center text-white" style="background: #004a80; padding: 50px 20px;">
            <div class="container">
                <h1>Our Courses</h1>
                <p>Explore our wide range of IT courses designed to help you succeed in the tech industry.</p>
            </div>
        </section>
        <section class="course-list fade-in container my-5">
            <h2 class="text-center mb-4">Available Courses</h2>
            <div id="courses-carousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner" id="courses-container">
                    <!-- Courses will be dynamically retrevied and inserted here -->
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#courses-carousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#courses-carousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
    </main>
    <footer class="text-center py-3" style="background: #0077cc; color: #fff;">
        <p>© 2025 Online IT Courses. All Rights Reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../frontend/js/scripts.js"></script>
</body>
</html>
